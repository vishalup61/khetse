<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KhetSe Admin Login</title><link rel="stylesheet" href="style.css"></head>
<body class="admin-page"><div class="admin-login"><div class="admin-brand">🌾 <strong>KhetSe</strong></div><span class="eyebrow">ADMIN PANEL</span><h1>Welcome back</h1><p>Securely manage products, orders and reviews.</p><form onsubmit="login(event)"><label>Username<input id="username" required value="admin"></label><label>Password<input id="password" type="password" required></label><button class="btn primary wide">Login to dashboard</button><div id="msg" class="form-msg"></div></form><a href="/" class="text-btn">← Back to store</a></div>
<script>
async function login(e){e.preventDefault();const msg=document.getElementById("msg");msg.textContent="";try{const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.message||"Login failed");localStorage.setItem("khetseAdminToken",d.token);location.href="/admin.html";}catch(x){msg.textContent=x.message;}}
</script></body></html>
